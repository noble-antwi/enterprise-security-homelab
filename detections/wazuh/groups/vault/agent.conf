<!--
  Shared configuration for the Wazuh agent group "vault" (VAULT01, agent 007).
  Lives on SIEM01 at /var/ossec/etc/shared/vault/agent.conf; edited from the
  dashboard (Agents management > Groups > vault). Every agent in the group
  merges this with its own ossec.conf.

  os="Linux" keeps the block off any Windows host added to the group by
  mistake. Vault's file audit device writes one JSON object per line, so the
  agent reads it as json and Wazuh decodes every field.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/vault/audit.log</location>
  </localfile>
</agent_config>
