<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
  <title>How the scanner gets local admin rights</title>
  <desc>svc-greenbone is a member of SG-Scanner-LocalAdmin, which is named in the SEC-Scanner-Access policy item, which reaches the BIIRA Computers OU through its link and is applied by each machine to its own local Administrators group. The Domain Controllers OU is not linked.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3D4F66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="559" rx="12" fill="#FFFFFF" stroke="#D6E4EA"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="11" fill="#0E7490" letter-spacing="1.3" x="30" y="32">HOW THE SCANNER GETS LOCAL ADMIN</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="16" fill="#08152F" x="30" y="56">Every right is a chain of links</text>

  <rect x="60" y="80" width="300" height="56" rx="6" fill="#E8EEF8" stroke="#1B2F5E"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="210" y="103" text-anchor="middle">svc-greenbone</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="210" y="123" text-anchor="middle">the identity: who</text>
  <line x1="210" y1="136" x2="210" y2="172" stroke="#3D4F66" stroke-width="1.2" marker-end="url(#a)"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="224" y="159">member of</text>

  <rect x="60" y="176" width="300" height="56" rx="6" fill="#E8EEF8" stroke="#1B2F5E"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="210" y="199" text-anchor="middle">SG-Scanner-LocalAdmin</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="210" y="219" text-anchor="middle">the role: a list of members</text>
  <line x1="210" y1="232" x2="210" y2="268" stroke="#3D4F66" stroke-width="1.2" marker-end="url(#a)"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="224" y="255">named in</text>

  <rect x="60" y="272" width="300" height="56" rx="6" fill="#ECF6F9" stroke="#0E7490"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="210" y="295" text-anchor="middle">SEC-Scanner-Access</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="210" y="315" text-anchor="middle">item: add role to Administrators</text>
  <line x1="210" y1="328" x2="210" y2="364" stroke="#3D4F66" stroke-width="1.2" marker-end="url(#a)"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="224" y="351">reaches via its link</text>

  <rect x="60" y="368" width="300" height="56" rx="6" fill="#ECF6F9" stroke="#0E7490"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="210" y="391" text-anchor="middle">Linked to BIIRA\Computers</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="210" y="411" text-anchor="middle">Servers, Workstations inherit</text>

  <line x1="360" y1="396" x2="420" y2="396" stroke="#8A96A3" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="420" y="368" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#8A96A3" stroke-dasharray="5 4"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="530" y="391" text-anchor="middle">Domain Controllers OU</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="530" y="411" text-anchor="middle">not linked: DC01 untouched</text>

  <line x1="210" y1="424" x2="210" y2="460" stroke="#3D4F66" stroke-width="1.2" marker-end="url(#a)"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="224" y="447">applied on each machine</text>

  <rect x="60" y="464" width="300" height="56" rx="6" fill="#F2F4F6" stroke="#8A96A3"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="210" y="487" text-anchor="middle">WKS01 local Administrators</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="210" y="507" text-anchor="middle">now includes the role</text>

  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="420" y="480">Break any link and the</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="420" y="498">access is gone.</text>
</svg>
