<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="400" fill="#FFFFFF"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#08152F">How IDP01 got its HTTPS certificate</text>
  <text x="24" y="55" font-size="12" fill="#0E7490">Only public pieces travel. The private key never leaves IDP01.</text>

  <!-- IDP01 card -->
  <rect x="24" y="74" width="210" height="300" rx="10" fill="#ECF6F9" stroke="#1B2F5E" stroke-width="1.5"/>
  <rect x="24" y="74" width="210" height="36" rx="10" fill="#08152F"/>
  <rect x="24" y="100" width="210" height="10" fill="#08152F"/>
  <text x="129" y="97" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">IDP01 · 192.168.50.4</text>

  <rect x="38" y="124" width="182" height="74" rx="8" fill="#FFFFFF" stroke="#1B2F5E" stroke-width="1"/>
  <circle cx="54" cy="142" r="10" fill="#0E7490"/>
  <text x="54" y="146" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="72" y="146" font-size="12.5" font-weight="700" fill="#08152F">Make key + request</text>
  <text x="50" y="168" font-size="11" fill="#1B2F5E">idp01.key  (secret, chmod 600)</text>
  <text x="50" y="186" font-size="11" fill="#1B2F5E">idp01.csr  (name + public key)</text>

  <rect x="38" y="222" width="182" height="80" rx="8" fill="#FFFFFF" stroke="#1B2F5E" stroke-width="1"/>
  <circle cx="54" cy="240" r="10" fill="#0E7490"/>
  <text x="54" y="244" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="72" y="244" font-size="12.5" font-weight="700" fill="#08152F">Check the signature</text>
  <text x="50" y="266" font-size="11" fill="#1B2F5E">Root fingerprint matched first</text>
  <text x="50" y="286" font-size="11" fill="#1B2F5E">openssl verify: <tspan font-weight="700" fill="#0F6E56">OK</tspan></text>

  <rect x="38" y="314" width="182" height="48" rx="8" fill="#E3F4EE"/>
  <text x="50" y="334" font-size="11.5" font-weight="700" fill="#0F6E56">Key stays home</text>
  <text x="50" y="352" font-size="11" fill="#0F6E56">idp01.key is never copied</text>

  <!-- CA01 card -->
  <rect x="446" y="74" width="210" height="300" rx="10" fill="#ECF6F9" stroke="#1B2F5E" stroke-width="1.5"/>
  <rect x="446" y="74" width="210" height="36" rx="10" fill="#08152F"/>
  <rect x="446" y="100" width="210" height="10" fill="#08152F"/>
  <text x="551" y="97" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CA01 · Biira Bank Root CA</text>

  <rect x="460" y="124" width="182" height="166" rx="8" fill="#FFFFFF" stroke="#1B2F5E" stroke-width="1"/>
  <circle cx="476" cy="142" r="10" fill="#0E7490"/>
  <text x="476" y="146" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="494" y="146" font-size="12.5" font-weight="700" fill="#08152F">Check, then sign</text>
  <text x="472" y="172" font-size="11" fill="#1B2F5E">Is the requester a domain</text>
  <text x="472" y="190" font-size="11" fill="#1B2F5E">account allowed to use the</text>
  <text x="472" y="208" font-size="11" fill="#1B2F5E">Web Server template?</text>
  <text x="472" y="238" font-size="11.5" font-weight="700" fill="#0F6E56">Yes: sign with the root key</text>
  <text x="472" y="264" font-size="11" fill="#1B2F5E">Request ID 3, valid 2 years</text>

  <rect x="460" y="314" width="182" height="48" rx="8" fill="#FBEAE5"/>
  <text x="472" y="334" font-size="11.5" font-weight="700" fill="#B0422A">First try refused</text>
  <text x="472" y="352" font-size="11" fill="#B0422A">local login, unknown to AD</text>

  <!-- step 2: request travels to CA01 -->
  <line x1="234" y1="161" x2="444" y2="161" stroke="#0E7490" stroke-width="2"/>
  <polygon points="458,161 444,155 444,167" fill="#0E7490"/>
  <rect x="262" y="128" width="156" height="22" rx="11" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.2"/>
  <text x="340" y="143" font-size="11.5" font-weight="700" fill="#0E7490" text-anchor="middle">2  Request (CSR)</text>
  <text x="340" y="180" font-size="10.5" fill="#1B2F5E" text-anchor="middle">pasted as text, safe to share</text>

  <!-- step 4: certificate travels back -->
  <line x1="446" y1="262" x2="236" y2="262" stroke="#0E7490" stroke-width="2"/>
  <polygon points="222,262 236,256 236,268" fill="#0E7490"/>
  <rect x="262" y="229" width="156" height="22" rx="11" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.2"/>
  <text x="340" y="244" font-size="11.5" font-weight="700" fill="#0E7490" text-anchor="middle">4  Signed certificate</text>
  <text x="340" y="281" font-size="10.5" fill="#1B2F5E" text-anchor="middle">public by design, valid to Oct 2028</text>
</svg>
