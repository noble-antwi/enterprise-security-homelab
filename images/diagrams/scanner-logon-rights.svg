<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
  <title>Which ways svc-greenbone can sign in to WKS01</title>
  <desc>svc-greenbone can reach WKS01 only through network logon, which is how scans work. Local logon, Remote Desktop, batch job and service logon are denied by the SEC-Scanner-Access policy. Deny beats allow, so being an administrator does not reopen them.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="479" rx="12" fill="#FFFFFF" stroke="#D6E4EA"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="11" fill="#0E7490" letter-spacing="1.3" x="30" y="32">LOGON RIGHTS IN SEC-SCANNER-ACCESS</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="16" fill="#08152F" x="30" y="56">One door open, four closed</text>

  <rect x="40" y="236" width="180" height="56" rx="6" fill="#F2F4F6" stroke="#8A96A3"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="130" y="259" text-anchor="middle">svc-greenbone</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#3D4F66" x="130" y="279" text-anchor="middle">admin on WKS01</text>

  <rect x="300" y="80" width="340" height="350" rx="8" fill="none" stroke="#8A96A3" stroke-dasharray="5 4"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#08152F" x="318" y="100">WKS01</text>

  <line x1="220" y1="264" x2="316" y2="136" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="220" y1="264" x2="318" y2="198" stroke="#B4BFCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="220" y1="264" x2="318" y2="260" stroke="#B4BFCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="220" y1="264" x2="318" y2="322" stroke="#B4BFCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="220" y1="264" x2="318" y2="384" stroke="#B4BFCA" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="320" y="110" width="300" height="52" rx="6" fill="#E3F4EE" stroke="#0F6E56"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#0B4A3A" x="470" y="131" text-anchor="middle">Network logon</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#1F6B55" x="470" y="150" text-anchor="middle">open: this is how scans work</text>

  <rect x="320" y="172" width="300" height="52" rx="6" fill="#FBEAE5" stroke="#B0422A"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#6E2412" x="470" y="193" text-anchor="middle">Local logon</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#8A3A26" x="470" y="212" text-anchor="middle">denied: no sitting at the keyboard</text>

  <rect x="320" y="234" width="300" height="52" rx="6" fill="#FBEAE5" stroke="#B0422A"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#6E2412" x="470" y="255" text-anchor="middle">Remote Desktop</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#8A3A26" x="470" y="274" text-anchor="middle">denied: no desktop session</text>

  <rect x="320" y="296" width="300" height="52" rx="6" fill="#FBEAE5" stroke="#B0422A"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#6E2412" x="470" y="317" text-anchor="middle">Batch job</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#8A3A26" x="470" y="336" text-anchor="middle">denied: no scheduled tasks</text>

  <rect x="320" y="358" width="300" height="52" rx="6" fill="#FBEAE5" stroke="#B0422A"/>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#6E2412" x="470" y="379" text-anchor="middle">Service</text>
  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#8A3A26" x="470" y="398" text-anchor="middle">denied: no running as a service</text>

  <text font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="12" fill="#5B6C86" x="40" y="458">Administrators may use all five. The deny list closes four, and deny beats allow.</text>
</svg>
