  <rect x="20" y="88" width="158" height="104" rx="10" fill="none" stroke="#2DD4E8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.008;0.02;0.12;0.132;1"/></rect>
  <g opacity="0">
    <animateMotion path="M174 140 H264" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.16;1"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.028;0.04;0.16;0.172;1"/>
    <circle r="11" fill="#0E7490" opacity="0.3"><animate attributeName="r" values="8;15;8" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle r="6" fill="#0E7490" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <rect x="261" y="88" width="158" height="104" rx="10" fill="none" stroke="#B0422A" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.148;0.16;0.26;0.272;1"/></rect>
  <g opacity="0">
    <animateMotion path="M415 140 H505" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.24;0.36;1"/>
