    <circle r="11" fill="#B0422A" opacity="0.3"><animate attributeName="r" values="8;15;8" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle r="6" fill="#B0422A" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <rect x="502" y="88" width="158" height="104" rx="10" fill="none" stroke="#B0422A" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.348;0.36;0.48;0.492;1"/></rect>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.368;0.38;0.48;0.492;1"/>
    <circle cx="581" cy="155" r="12" fill="none" stroke="#B0422A" stroke-width="2.5">
      <animate attributeName="r" values="12;44" dur="0.9s" repeatCount="indefinite"/>
