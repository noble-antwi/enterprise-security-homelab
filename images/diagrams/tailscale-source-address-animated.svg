  </g>
  <rect x="261" y="238" width="158" height="104" rx="10" fill="none" stroke="#0F6E56" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.628;0.64;0.72;0.732;1"/></rect>
  <g opacity="0">
