      <animate attributeName="stroke-opacity" values="0.9;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="20" y="352" width="640" height="40" rx="8" fill="none" stroke="#0F6E56" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.868;0.88;0.97;0.982;1"/></rect>
