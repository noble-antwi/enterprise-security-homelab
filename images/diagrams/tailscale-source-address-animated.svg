  <g opacity="0">
    <animateMotion path="M174 290 H264" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.54;0.66;1"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.528;0.54;0.66;0.672;1"/>
    <circle r="11" fill="#0E7490" opacity="0.3"><animate attributeName="r" values="8;15;8" dur="0.9s" repeatCount="indefinite"/></circle>
